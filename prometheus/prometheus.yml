global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'paperpulse'
    environment: 'production'

rule_files:
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'paperpulse-app'
    scrape_interval: 10s
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'paperpulse'
          env: 'production'
    metrics_path: '/api/metrics'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
