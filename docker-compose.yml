
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: paperpulse-db
    environment:
      POSTGRES_USER: ${DB_USER:-paperpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-paperpulse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paperpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paperpulse-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paperpulse-app
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-paperpulse}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-paperpulse_db}
      
      # Next.js
      NEXT_PUBLIC_URL: http://localhost:3000
      NODE_ENV: ${NODE_ENV:-production}
      
      # NextAuth
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-5EgT4q2kN7pLm9xJ1w3vR6yB8cZ0dF2hA4sT6uI9oP}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public:/app/public
    networks:
      - paperpulse-network
    restart: unless-stopped

  # Optional: pgAdmin untuk database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: paperpulse-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@paperpulse.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - paperpulse-network
    profiles:
      - dev

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: paperpulse-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    networks:
      - paperpulse-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: paperpulse-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - paperpulse-network
    restart: unless-stopped

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: paperpulse-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - paperpulse-network
    restart: unless-stopped

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: paperpulse-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - paperpulse-network
    restart: unless-stopped

networks:
  paperpulse-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
