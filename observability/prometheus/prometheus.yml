# =============================================================================
# Prometheus Configuration for PaperPulse
# =============================================================================

global:
  scrape_interval: 15s          # Interval pengambilan metrics
  evaluation_interval: 15s      # Interval evaluasi rules
  external_labels:
    monitor: 'paperpulse-monitor'
    environment: 'development'

# =============================================================================
# Alertmanager Configuration (Optional - untuk alerting)
# =============================================================================
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# =============================================================================
# Rule Files (Optional - untuk recording rules & alerts)
# =============================================================================
# rule_files:
#   - /etc/prometheus/rules/*.yml

# =============================================================================
# Scrape Configurations
# =============================================================================
scrape_configs:
  # ---------------------------------------------------------------------------
  # Job: Prometheus Self-Monitoring
  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'
    metrics_path: /metrics

  # ---------------------------------------------------------------------------
  # Job: PaperPulse Next.js Application
  # ---------------------------------------------------------------------------
  # PaperPulse berjalan sebagai container dalam network yang sama
  # Target menggunakan service name 'paperpulse' dari Docker Compose
  # ---------------------------------------------------------------------------
  - job_name: 'paperpulse'
    metrics_path: /api/metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['paperpulse:3000']
        labels:
          app: 'paperpulse'
          environment: 'production'
    # Retry jika gagal (berguna saat startup)
    honor_labels: true
    honor_timestamps: true

  # ---------------------------------------------------------------------------
  # Job: Node Exporter - Host/Container Metrics
  # ---------------------------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'docker-host'
    metrics_path: /metrics